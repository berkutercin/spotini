[package]
name = "spotini-demo"
version = "1.0.0"
description = "spotini's screens in a browser, with a made-up library"
license = "MIT"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
# rand's randomness, from the browser.
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1"
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"

[build-dependencies]
slint-build = "1.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
